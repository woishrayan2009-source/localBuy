<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LocalBuy — Browse Shops</title>
  <link rel="manifest" href="/assets/manifest.json">
  <meta name="theme-color" content="#0f5c3a">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/customer.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    
    <!-- SECTION: BROWSE -->
    <section id="section-browse" class="spa-section active" data-section="browse">
      <header class="sticky-header">
        <div class="search-bar">
          <input type="text" id="shop-search" placeholder="Search shops or items…">
          <button id="btn-gps" class="icon-btn" aria-label="Sort by location" onclick="sortShopsByGPS()">📍</button>
        </div>
        <div class="category-chips">
          <button class="chip active" data-cat="all">All</button>
          <button class="chip" data-cat="kirana">🛒 Kirana</button>
          <button class="chip" data-cat="chemist">💊 Chemist</button>
          <button class="chip" data-cat="bakery">🎂 Bakery</button>
          <button class="chip" data-cat="dairy">🥛 Dairy</button>
        </div>
      </header>
      <div id="shop-grid" class="shop-grid">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- SECTION: MODAL (OVERLAY) -->
    <section id="section-modal" class="spa-section modal-overlay" data-section="modal">
      <div class="bottom-sheet" role="dialog" aria-modal="true">
        <button class="close-modal" onclick="navigate('browse')">✕</button>
        <div id="modal-content"></div>
      </div>
    </section>

    <!-- SECTION: ORDER -->
    <section id="section-order" class="spa-section" data-section="order">
      <header class="top-bar">
        <button class="back-btn" onclick="navigate('browse')">&larr;</button>
        <h2 id="order-shop-name">Shop Name</h2>
        <button class="clear-btn" onclick="clearOrder()">Clear</button>
      </header>
      <div class="order-form">
        <div class="tabs">
          <button class="tab active" onclick="switchTab('text')">Type List</button>
          <button class="tab" onclick="switchTab('photo')">Upload Photo</button>
        </div>
        
        <div id="tab-text" class="tab-content active">
          <textarea id="order-text" placeholder="Type your items here, one per line.&#10;Example:&#10;Tata Salt 1kg × 2&#10;Amul Butter 500g" minlength="3"></textarea>
          <p class="hint">Tip: Add quantity for faster service</p>
        </div>

        <div id="tab-photo" class="tab-content" style="display:none;">
          <label class="upload-zone">
            <span>Take a photo of your handwritten list</span>
            <input type="file" id="order-photo" accept="image/*" capture="environment">
          </label>
          <p class="hint">Our shopkeeper will read and confirm your list.</p>
        </div>

        <div class="time-picker">
          <label>When will you walk in?</label>
          <div class="time-slots" id="time-slots">
            <button class="slot active">As soon as ready</button>
            <!-- Generated via JS -->
          </div>
        </div>

        <textarea id="order-notes" class="small-textarea" placeholder="Any special requests? (optional)"></textarea>
      </div>
      <div class="fixed-bottom">
        <button class="btn-primary full-width" onclick="navigate('checkout')">Review Order &rarr;</button>
      </div>
    </section>

    <!-- SECTION: CHECKOUT -->
    <section id="section-checkout" class="spa-section" data-section="checkout">
      <header class="top-bar">
        <button class="back-btn" onclick="navigate('order')">&larr;</button>
        <h2>Checkout</h2>
      </header>
      <div class="checkout-content">
        <div class="summary-card" id="checkout-summary"></div>
        
        <div class="info-box amber">
          The shopkeeper will confirm the exact total and flag anything out of stock before you pay.
        </div>

        <h3>Payment Method</h3>
        <label class="radio-card">
          <input type="radio" name="payment" value="pickup" checked>
          <div class="card-body">
            <strong>💵 Pay at Pickup (Cash/UPI)</strong>
            <span>Pay when you collect your order</span>
          </div>
        </label>
        
        <label class="radio-card">
          <input type="radio" name="payment" value="upi">
          <div class="card-body">
            <strong><svg class="upi-icon" ...></svg> Pay Now via UPI</strong>
            <span>Secured · Instant confirmation</span>
          </div>
        </label>

        <div id="upi-options" style="display:none;" class="upi-row">
          <button onclick="payUPI('gpay')">GPay</button>
          <button onclick="payUPI('phonepe')">PhonePe</button>
          <button onclick="payUPI('paytm')">Paytm</button>
        </div>
      </div>
      <div class="fixed-bottom">
        <button class="btn-primary full-width" onclick="submitOrder()">Confirm Order</button>
      </div>
    </section>

    <!-- SECTION: TRACKER -->
    <section id="section-tracker" class="spa-section" data-section="tracker">
      <div class="tracker-header">
        <h2 id="tracker-order-id">LB-XXXX</h2>
        <p id="tracker-shop-name">Shop Name</p>
      </div>
      <div class="progress-track" id="progress-track">
        <!-- Rendered via JS -->
      </div>
      <div id="order-code-box" class="code-box" style="display:none;">
        <span class="code" id="pickup-code"></span>
        <p>Show this code at the counter</p>
      </div>
      <div class="fixed-bottom bg-transparent">
        <button class="btn-outline-red small" id="btn-cancel" onclick="cancelOrder()">Cancel Order</button>
        <button class="ghost-link" onclick="navigate('order')">Order another item</button>
      </div>
    </section>

  </div>
  
  <script src="/js/db-bridge.js"></script>
  <script src="/js/geo.js"></script>
  <script src="/js/upi.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/customer.js"></script>
  <script src="/js/sw-register.js"></script>
</body>
</html>
